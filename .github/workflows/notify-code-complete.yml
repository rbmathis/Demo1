name: "Notify — Code Complete"

on:
  pull_request:
    types: [ready_for_review, review_requested]

jobs:
  notify-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      actions: write
    steps:
      - name: Extract linked issue number
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const title = context.payload.pull_request.title || '';
            const pr = context.payload.pull_request;

            // Strategy 1: Closing keywords in PR body (most reliable)
            let match = body.match(/(?:closes|fixes|resolves)\s+#(\d+)/i);
            if (match) {
              core.info(`Found issue #${match[1]} via closing keyword in PR body`);
              core.setOutput('number', match[1]);
              return match[1];
            }

            // Strategy 2: PR title contains (#N) pattern
            match = title.match(/\(#(\d+)\)/);
            if (match) {
              // Validate it's actually an issue, not a PR reference
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(match[1])
                });
                if (!issue.data.pull_request) {
                  core.info(`Found issue #${match[1]} via PR title, validated as issue`);
                  core.setOutput('number', match[1]);
                  return match[1];
                }
                core.info(`#${match[1]} from title is a PR, not an issue — skipping`);
              } catch (e) {
                core.info(`#${match[1]} from title does not exist — skipping`);
              }
            }

            // Strategy 3: Explicit pipeline metadata in PR body
            match = body.match(/^(?:Pipeline-Issue|Issue):\s*#(\d+)\s*$/im);
            if (match) {
              core.info(`Found issue #${match[1]} via pipeline metadata in PR body`);
              core.setOutput('number', match[1]);
              return match[1];
            }

            core.warning(`No linked issue found for PR #${pr.number} ("${title}"). ` +
              `Ensure the PR body contains "Closes #N" or the title contains "(#N)".`);
            return '';

      - name: Check for duplicate notification
        id: guard
        if: steps.issue.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.issue.outputs.number }}');
            const pr = context.payload.pull_request;

            // Check if we already posted a code-complete comment for this PR
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 50
            });

            const alreadyNotified = comments.data.some(c =>
              c.body.includes('Pipeline — Code Complete') &&
              c.body.includes(`PR: #${pr.number}`)
            );

            if (alreadyNotified) {
              core.info(`Code-complete comment already exists for PR #${pr.number} on issue #${issueNumber} — skipping`);
              core.setOutput('skip', 'true');
              return;
            }

            // Check issue is in the right pipeline state
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const labels = issue.data.labels.map(l => typeof l === 'string' ? l : l.name);
            const inImplementing = labels.includes('cloud/implementing');

            if (!inImplementing) {
              core.warning(`Issue #${issueNumber} does not have cloud/implementing label (has: ${labels.join(', ')}). Proceeding anyway.`);
            }

            core.setOutput('skip', 'false');

      - name: Post code-complete comment on issue
        if: steps.issue.outputs.number != '' && steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.issue.outputs.number }}');
            const pr = context.payload.pull_request;
            const timestamp = new Date().toISOString().replace('T', ' ').replace(/\.\d+Z/, ' UTC');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## ✅ Pipeline — Code Complete\n\n**Timestamp:** ${timestamp}\n**PR:** #${pr.number}\n**Branch:** \`${pr.head.ref}\`\n\nCopilot coding agent has finished work. The PR is ready for review.\n\n---\n*Auto-posted by notify-code-complete workflow*`
            });

      - name: Transition label to cloud/review
        if: steps.issue.outputs.number != '' && steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.issue.outputs.number }}');

            // Remove cloud/implementing if present
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'cloud/implementing'
              });
            } catch (e) {
              core.info('cloud/implementing label not present — that is OK');
            }

            // Add cloud/review
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['cloud/review']
            });

      - name: Dispatch pipeline-review workflow
        if: steps.issue.outputs.number != '' && steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pipeline-review.lock.yml',
              ref: context.payload.pull_request.base.ref,
              inputs: {
                issue_number: '${{ steps.issue.outputs.number }}'
              }
            });
