name: Pipeline — Deploy

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: write
  pull-requests: write
  deployments: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # DEPLOY: Triggered when pipeline:deploying label is applied
  # Merges PR → deploys → health checks → marks complete or rollback
  # ─────────────────────────────────────────────────────────────────────
  deploy:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'pipeline:deploying'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Parse pipeline state and find PR
        id: state
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            // Parse pipeline state
            const comments = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: issue.number,
            });

            let reviewData = null;
            let branch = null;
            for (const comment of comments.data.reverse()) {
              const match = comment.body.match(/```json\n([\s\S]*?)\n```/);
              if (match) {
                try {
                  const parsed = JSON.parse(match[1]);
                  if (parsed.pipeline === 'sdlc') {
                    if (parsed.stage === 'review' && parsed.status === 'completed') {
                      reviewData = parsed;
                    }
                    if (parsed.branch && !branch) {
                      branch = parsed.branch;
                    }
                  }
                } catch { /* skip */ }
              }
            }

            if (!reviewData) {
              core.setFailed('Could not find completed review state. Pipeline may be corrupted.');
              return;
            }

            const prNumber = reviewData.pr;
            if (!prNumber) {
              core.setFailed('No PR number in review state.');
              return;
            }

            core.setOutput('pr_number', prNumber.toString());
            core.setOutput('branch', branch || '');

      - name: Merge PR (squash)
        id: merge
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.state.outputs.pr_number }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER);
            const issue = context.payload.issue;

            try {
              const mergeResult = await github.rest.pulls.merge({
                ...context.repo,
                pull_number: prNumber,
                merge_method: 'squash',
                commit_title: `${issue.title} (#${prNumber})`,
                commit_message: `Closes #${issue.number}\n\nAutonomous pipeline deployment.`,
              });

              core.setOutput('sha', mergeResult.data.sha);
              core.setOutput('merged', 'true');
            } catch (err) {
              core.setOutput('merged', 'false');
              core.setOutput('merge_error', err.message);
              core.warning(`Merge failed: ${err.message}`);
            }

      - name: Checkout merged main
        if: steps.merge.outputs.merged == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup .NET
        if: steps.merge.outputs.merged == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build for deployment
        id: build
        if: steps.merge.outputs.merged == 'true'
        run: dotnet publish --configuration Release --output ./publish
        continue-on-error: true

      - name: Deploy to Azure (placeholder)
        id: deploy
        if: steps.merge.outputs.merged == 'true' && steps.build.outcome == 'success'
        run: |
          echo "🚀 Deployment step"
          echo "In production, this would deploy to Azure App Service or Container Apps."
          echo "deploy_url=https://demo1.azurewebsites.net" >> "$GITHUB_OUTPUT"
          echo "deploy_status=success" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Health check (placeholder)
        id: health
        if: steps.deploy.outcome == 'success'
        run: |
          echo "🏥 Running health checks..."
          echo "In production, this would hit /health and verify HTTP 200."
          echo "health_status=healthy" >> "$GITHUB_OUTPUT"
          echo "response_time_ms=42" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Post deployment narrative
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.state.outputs.pr_number }}
          MERGED: ${{ steps.merge.outputs.merged }}
          MERGE_ERROR: ${{ steps.merge.outputs.merge_error }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          HEALTH_RESULT: ${{ steps.health.outcome }}
        with:
          script: |
            const issue = context.payload.issue;
            const prNumber = parseInt(process.env.PR_NUMBER);
            const merged = process.env.MERGED === 'true';
            const mergeError = process.env.MERGE_ERROR || '';
            const mergeSha = process.env.MERGE_SHA || '';
            const buildResult = process.env.BUILD_RESULT || 'skipped';
            const deployResult = process.env.DEPLOY_RESULT || 'skipped';
            const healthResult = process.env.HEALTH_RESULT || 'skipped';
            const timestamp = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';

            const allSuccess = merged && buildResult === 'success' && deployResult === 'success' && healthResult === 'success';
            const deployFailed = merged && (buildResult !== 'success' || deployResult !== 'success' || healthResult !== 'success');

            // ── Post Deploy Narrative ──
            let narrative;
            if (!merged) {
              narrative = [
                `## 🚀 Pipeline — Deploy Stage`,
                ``,
                `**Agent:** \`deployer\`  `,
                `**Timestamp:** ${timestamp}`,
                ``,
                `### ❌ Merge Failed`,
                ``,
                `Could not merge PR #${prNumber}: ${mergeError}`,
                ``,
                `### Thinking`,
                ``,
                `The PR may have merge conflicts or failed required status checks. Manual intervention needed.`,
                ``,
                `### Next`,
                ``,
                `**Manual resolution required.** Resolve merge conflicts or check failing status checks, then retry.`,
              ].join('\n');
            } else if (allSuccess) {
              narrative = [
                `## 🚀 Pipeline — Deploy Stage`,
                ``,
                `**Agent:** \`deployer\`  `,
                `**Timestamp:** ${timestamp}`,
                ``,
                `### Deployment Summary`,
                ``,
                `| Step | Status | Details |`,
                `|------|--------|---------|`,
                `| Merge | ✅ Merged | Squash merged PR #${prNumber} → main (\`${mergeSha.slice(0, 7)}\`) |`,
                `| Build | ✅ Success | Release build compiled cleanly |`,
                `| Deploy | ✅ Success | Deployed to production environment |`,
                `| Health | ✅ Healthy | Application responding normally |`,
                ``,
                `### 🎉 Pipeline Complete!`,
                ``,
                `Issue #${issue.number} has been successfully delivered from intake to production in a fully autonomous pipeline.`,
                ``,
                `### Thinking`,
                ``,
                `All deployment checks pass. The application is healthy post-deploy. No rollback needed.`,
                `The feature branch will be cleaned up automatically by GitHub's branch deletion setting.`,
              ].join('\n');
            } else {
              const failStep = buildResult !== 'success' ? 'build' : deployResult !== 'success' ? 'deploy' : 'health check';
              narrative = [
                `## 🚀 Pipeline — Deploy Stage`,
                ``,
                `**Agent:** \`deployer\`  `,
                `**Timestamp:** ${timestamp}`,
                ``,
                `### ⚠️ Deployment Issue`,
                ``,
                `| Step | Status |`,
                `|------|--------|`,
                `| Merge | ✅ Merged (\`${mergeSha.slice(0, 7)}\`) |`,
                `| Build | ${buildResult === 'success' ? '✅ Success' : '❌ Failed'} |`,
                `| Deploy | ${deployResult === 'success' ? '✅ Success' : deployResult === 'skipped' ? '⏭️ Skipped' : '❌ Failed'} |`,
                `| Health | ${healthResult === 'success' ? '✅ Healthy' : healthResult === 'skipped' ? '⏭️ Skipped' : '❌ Unhealthy'} |`,
                ``,
                `### Thinking`,
                ``,
                `Deployment failed at the **${failStep}** stage. ${healthResult !== 'success' && deployResult === 'success' ? 'The app deployed but is not responding correctly — rollback may be needed.' : 'The merge succeeded but deployment could not complete.'}`,
                ``,
                `### Next`,
                ``,
                `${healthResult !== 'success' && deployResult === 'success'
                  ? 'Triggering **Rollback** — the application is unhealthy in production.'
                  : 'Manual investigation needed. The merge is complete but deployment failed.'}`,
              ].join('\n');
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: narrative,
            });

            // ── Post machine-readable state ──
            const state = {
              pipeline: 'sdlc',
              stage: 'deploy',
              status: allSuccess ? 'completed' : (deployFailed ? 'failed' : 'blocked'),
              merge: { merged, sha: mergeSha, pr: prNumber },
              build: buildResult,
              deploy: deployResult,
              health: healthResult,
              attempt: 1,
              next: allSuccess ? 'done' : (healthResult !== 'success' && deployResult === 'success' ? 'rollback' : 'manual'),
              timestamp: new Date().toISOString(),
            };

            const stateComment = [
              `<details>`,
              `<summary>📊 Pipeline State</summary>`,
              ``,
              '```json',
              JSON.stringify(state, null, 2),
              '```',
              ``,
              `</details>`,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: stateComment,
            });

            // ── Final label updates ──
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: issue.number,
                name: 'pipeline:deploying',
              });
            } catch { /* ignore */ }

            if (allSuccess) {
              // Close the issue — pipeline complete!
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issue.number,
                labels: ['pipeline:done'],
              });

              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            } else if (healthResult !== 'success' && deployResult === 'success') {
              // Trigger rollback
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issue.number,
                labels: ['pipeline:rollback'],
              });
            } else {
              // Needs manual intervention
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issue.number,
                labels: ['pipeline:blocked'],
              });
            }

      - name: Delete feature branch
        if: steps.merge.outputs.merged == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.state.outputs.branch }}
        with:
          script: |
            const branch = process.env.BRANCH;
            if (!branch) return;
            try {
              await github.rest.git.deleteRef({
                ...context.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted branch: ${branch}`);
            } catch (err) {
              core.warning(`Could not delete branch ${branch}: ${err.message}`);
            }
