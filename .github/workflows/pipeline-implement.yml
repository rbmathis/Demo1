name: Pipeline — Plan & Implement

on:
  issues:
    types: [labeled]
  workflow_run:
    workflows: ["Pipeline Controller"]
    types: [completed]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # PLAN: Triggered when pipeline:planning label is applied
  # Creates feature branch + posts implementation plan
  # Also triggers via workflow_run when Pipeline Controller completes
  # ─────────────────────────────────────────────────────────────────────
  plan:
    if: >-
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'pipeline:planning') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Find issue with pipeline:planning label
        id: find-issue
        uses: actions/github-script@v7
        with:
          script: |
            // If triggered by label event, use the issue directly
            if (context.eventName === 'issues') {
              core.setOutput('issue_number', String(context.payload.issue.number));
              return;
            }

            // If triggered by workflow_run, find issue with pipeline:planning label
            const issues = await github.rest.issues.listForRepo({
              ...context.repo,
              labels: 'pipeline:planning',
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 1,
            });

            if (issues.data.length === 0) {
              core.info('No issues with pipeline:planning label found. Skipping.');
              core.setOutput('issue_number', '');
              return;
            }

            core.setOutput('issue_number', String(issues.data[0].number));

      - name: Check if we have an issue to process
        if: steps.find-issue.outputs.issue_number == ''
        run: |
          echo "No issue to process. Exiting gracefully."
          exit 0

      - name: Checkout repository
        if: steps.find-issue.outputs.issue_number != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Stage 1: Plan — Parse route state and create plan"
        id: plan
        if: steps.find-issue.outputs.issue_number != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.find-issue.outputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: issueNumber,
            });
            const timestamp = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';

            // ── Parse route state from comments ──
            const comments = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: issue.number,
            });

            let routeData = null;
            for (const comment of comments.data.reverse()) {
              const match = comment.body.match(/```json\n([\s\S]*?)\n```/);
              if (match) {
                try {
                  const parsed = JSON.parse(match[1]);
                  if (parsed.pipeline === 'sdlc' && parsed.stage === 'route') {
                    routeData = parsed;
                    break;
                  }
                } catch { /* skip */ }
              }
            }

            if (!routeData) {
              core.setFailed('Could not find route state. Pipeline may be corrupted.');
              return;
            }

            // ── Generate branch name ──
            const slug = issue.title
              .toLowerCase()
              .replace(/[^a-z0-9\s-]/g, '')
              .replace(/\s+/g, '-')
              .slice(0, 40)
              .replace(/-$/, '');
            const branch = `feat/issue-${issue.number}-${slug}`;

            // ── Analyze issue for plan generation ──
            const body = issue.body || '';
            const classification = routeData.classification || {};
            const agentsAssigned = routeData.agents_assigned || [];
            const executionOrder = routeData.execution_order || [];

            // Determine likely files to create/modify based on scope
            const scopeAreas = classification.scope_areas || [];
            const tasks = [];
            let taskId = 0;

            // Generate tasks based on assigned agents
            for (const agent of agentsAssigned) {
              taskId++;
              if (agent === 'backend') {
                const controllerMatch = body.match(/controller|endpoint|api|action/i);
                const modelMatch = body.match(/model|entity|viewmodel/i);
                if (controllerMatch) {
                  tasks.push({
                    id: taskId,
                    description: 'Create/modify controller with required actions',
                    agent: 'backend',
                    area: 'Controllers/',
                    action: 'create/modify',
                    depends_on: [],
                  });
                }
                if (modelMatch) {
                  taskId++;
                  tasks.push({
                    id: taskId,
                    description: 'Create/modify model or view model',
                    agent: 'backend',
                    area: 'Models/',
                    action: 'create/modify',
                    depends_on: [],
                  });
                }
                if (!controllerMatch && !modelMatch) {
                  tasks.push({
                    id: taskId,
                    description: 'Implement backend changes per issue requirements',
                    agent: 'backend',
                    area: 'Controllers/ or Services/',
                    action: 'create/modify',
                    depends_on: [],
                  });
                }
              } else if (agent === 'frontend') {
                tasks.push({
                  id: taskId,
                  description: 'Create/modify Razor views and client-side assets',
                  agent: 'frontend',
                  area: 'Views/',
                  action: 'create/modify',
                  depends_on: [],
                });
              } else if (agent === 'security') {
                tasks.push({
                  id: taskId,
                  description: 'Add security hardening (auth, validation, headers)',
                  agent: 'security',
                  area: 'Cross-cutting',
                  action: 'modify',
                  depends_on: [],
                });
              } else if (agent === 'devops') {
                tasks.push({
                  id: taskId,
                  description: 'Update CI/CD workflows or Docker configuration',
                  agent: 'devops',
                  area: '.github/workflows/ or Dockerfile',
                  action: 'modify',
                  depends_on: [],
                });
              } else if (agent === 'testing') {
                tasks.push({
                  id: taskId,
                  description: 'Write unit and integration tests for new functionality',
                  agent: 'testing',
                  area: 'tests/',
                  action: 'create',
                  depends_on: tasks.filter(t => t.agent !== 'testing' && t.agent !== 'docs').map(t => t.id),
                });
              } else if (agent === 'docs') {
                tasks.push({
                  id: taskId,
                  description: 'Update documentation and XML comments',
                  agent: 'docs',
                  area: 'docs/ and source files',
                  action: 'create/modify',
                  depends_on: tasks.filter(t => t.agent !== 'docs').map(t => t.id),
                });
              }
            }

            // ── Post Plan Narrative ──
            const taskTable = tasks.map(t =>
              `| ${t.id} | ${t.description} | \`${t.agent}\` | \`${t.area}\` | ${t.action} | ${t.depends_on.length ? t.depends_on.join(', ') : 'none'} |`
            ).join('\n');

            const narrative = [
              `## 📋 Pipeline — Plan Stage`,
              ``,
              `**Agent:** \`planner\`  `,
              `**Timestamp:** ${timestamp}`,
              ``,
              `### Codebase Analysis`,
              ``,
              `Based on the routing decision, I need to coordinate **${agentsAssigned.length} agents** to deliver this ${classification.type || 'enhancement'}.`,
              ``,
              `**Execution strategy:** ${executionOrder.map((g, i) => `Step ${i+1}: ${g.join(' + ')}`).join(' → ')}`,
              ``,
              `### Implementation Plan`,
              ``,
              `| # | Task | Agent | Area | Action | Depends On |`,
              `|---|------|-------|------|--------|-----------|`,
              taskTable,
              ``,
              `### Design Decisions`,
              ``,
              `- **Branch strategy:** Trunk-based with short-lived feature branch`,
              `- **Commit style:** Conventional commits referencing issue #${issue.number}`,
              `- **Testing approach:** ${classification.type === 'bug' ? 'Regression test to prevent recurrence' : 'Unit + integration tests for new behavior'}`,
              `- **Documentation:** ${agentsAssigned.includes('docs') ? 'README and XML comment updates included' : 'Inline comments only'}`,
              ``,
              `### Thinking`,
              ``,
              `I decomposed this issue into ${tasks.length} tasks based on the agent assignments from the Route stage. `,
              `${executionOrder.length > 1 ? `The execution order ensures dependencies are respected — implementation agents go first, then testing verifies their output, and docs captures the final state.` : 'Single-step execution — straightforward change.'}`,
              ``,
              `### Branch`,
              ``,
              `Created: \`${branch}\``,
              ``,
              `### Next`,
              ``,
              `Handing off to **Implement** stage. The implementer will execute this plan by delegating to specialist agents.`,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: narrative,
            });

            // ── Post machine-readable state ──
            const state = {
              pipeline: 'sdlc',
              stage: 'plan',
              status: 'completed',
              branch: branch,
              plan: { tasks, execution_order: executionOrder },
              classification: classification,
              attempt: 1,
              agents_assigned: agentsAssigned,
              next: 'implement',
              timestamp: new Date().toISOString(),
            };

            const stateComment = [
              `<details>`,
              `<summary>📊 Pipeline State</summary>`,
              ``,
              '```json',
              JSON.stringify(state, null, 2),
              '```',
              ``,
              `</details>`,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: stateComment,
            });

            // ── Create feature branch ──
            const mainRef = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/main',
            });

            try {
              await github.rest.git.createRef({
                ...context.repo,
                ref: `refs/heads/${branch}`,
                sha: mainRef.data.object.sha,
              });
              core.info(`Created branch: ${branch}`);
            } catch (err) {
              if (err.status === 422) {
                core.info(`Branch ${branch} already exists, continuing.`);
              } else {
                throw err;
              }
            }

            // ── Update labels ──
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: issue.number,
                name: 'pipeline:planning',
              });
            } catch { /* ignore */ }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: ['pipeline:implementing'],
            });

            // Signal proceed to implement step (chained in same job to avoid GITHUB_TOKEN re-trigger limitation)
            core.setOutput('proceed', 'true');
            core.setOutput('branch', branch);
            core.setOutput('tasks_json', JSON.stringify(tasks));
            core.setOutput('agents_json', JSON.stringify(agentsAssigned));

      # ─────────────────────────────────────────────────────────────────
      # Stage 2: Implement — Delegate to Copilot coding agent
      # Runs as chained step (GITHUB_TOKEN labels don't re-trigger same workflow)
      # ─────────────────────────────────────────────────────────────────
      - name: "Stage 2: Implement — Assign to coding agent"
        id: implement
        if: steps.plan.outputs.proceed == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.find-issue.outputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: issueNumber,
            });
            const timestamp = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';

            const branch = '${{ steps.plan.outputs.branch }}';
            const tasks = JSON.parse('${{ steps.plan.outputs.tasks_json }}');
            const agentsAssigned = JSON.parse('${{ steps.plan.outputs.agents_json }}');

            // ── Post implementation start narrative ──
            const taskList = tasks.map(t =>
              `- [ ] **Task ${t.id}:** ${t.description} (\`${t.agent}\` → \`${t.area}\`)`
            ).join('\n');

            const narrative = [
              `## 🔨 Pipeline — Implement Stage`,
              ``,
              `**Agent:** \`implementer\`  `,
              `**Timestamp:** ${timestamp}`,
              ``,
              `### Starting Implementation`,
              ``,
              `I'm beginning work on branch \`${branch}\` with ${tasks.length} tasks across ${agentsAssigned.length} specialist agents.`,
              ``,
              `### Task Checklist`,
              ``,
              taskList,
              ``,
              `### Approach`,
              ``,
              `I'll execute these tasks in dependency order, delegating to the appropriate specialist agent for each. `,
              `Progress updates will be posted as work proceeds.`,
              ``,
              `### Delegation`,
              ``,
              `Assigning this issue to the Copilot coding agent for autonomous implementation on branch \`${branch}\`.`,
              `The agent will follow the plan above, commit with conventional messages, and create a PR when complete.`,
              ``,
              `### Instructions for Coding Agent`,
              ``,
              `When implementing, follow these rules:`,
              `1. Work on branch \`${branch}\``,
              `2. Follow existing patterns in the codebase`,
              `3. Use conventional commits: \`feat(scope): description\\n\\nRefs: #${issue.number}\``,
              `4. Create a PR titled "${issue.title}" with body referencing \`Closes #${issue.number}\``,
              `5. Apply label \`pipeline:testing\` to the PR once implementation is complete`,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: narrative,
            });

            // ── Post machine-readable state ──
            const state = {
              pipeline: 'sdlc',
              stage: 'implement',
              status: 'in-progress',
              branch: branch,
              tasks_total: tasks.length,
              tasks_completed: 0,
              attempt: 1,
              agents_assigned: agentsAssigned,
              artifacts: {},
              next: 'test',
              timestamp: new Date().toISOString(),
            };

            const stateComment = [
              `<details>`,
              `<summary>📊 Pipeline State</summary>`,
              ``,
              '```json',
              JSON.stringify(state, null, 2),
              '```',
              ``,
              `</details>`,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: stateComment,
            });

            // ── Assign to Copilot for autonomous implementation ──
            try {
              await github.rest.issues.addAssignees({
                ...context.repo,
                issue_number: issue.number,
                assignees: ['copilot[bot]'],
              });
              core.info('Assigned issue to Copilot coding agent');
            } catch (err) {
              core.warning(`Could not assign to copilot bot: ${err.message}. Manual implementation may be needed.`);

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: [
                  `## 🔨 Pipeline — Implement Stage (Manual Trigger Needed)`,
                  ``,
                  `**Agent:** \`pipeline\`  `,
                  `**Timestamp:** ${timestamp}`,
                  ``,
                  `⚠️ Could not automatically assign to Copilot coding agent.`,
                  ``,
                  `**To continue the pipeline manually:**`,
                  `1. Open the \`implementer\` agent in VS Code Copilot Chat`,
                  `2. Reference this issue: "Implement the plan for issue #${issue.number}"`,
                  `3. The agent will follow the plan and create a PR`,
                  `4. Apply \`pipeline:testing\` label to the PR when done`,
                ].join('\n'),
              });
            }
