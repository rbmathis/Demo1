name: "Pipeline — Finish"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number whose PR should be merged and issue closed"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  finish:
    name: Merge PR and close issue
    runs-on: ubuntu-latest
    steps:
      - name: Find and merge the PR
        id: merge
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const MAX_PRS_TO_SCAN = 100;
            const issueRefRegex = new RegExp(`\\b(closes|fixes|resolves)\\s+#${issueNumber}\\b`, 'i');

            const findLinkedPr = async (state) => {
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state,
                sort: 'updated',
                direction: 'desc',
                // Scan a larger recent window to avoid missing linked PRs in busy repos.
                per_page: MAX_PRS_TO_SCAN
              });

              return pulls.find(pr => pr.body && issueRefRegex.test(pr.body));
            };

            // Prefer an open PR, but allow already-merged PRs for reruns/idempotency.
            const linkedPR = (await findLinkedPr('open')) ?? (await findLinkedPr('closed'));

            if (!linkedPR) {
              core.setFailed(`No PR found linked to issue #${issueNumber}`);
              return;
            }

            core.info(`Found PR #${linkedPR.number}: ${linkedPR.title}`);
            core.setOutput('pr_number', linkedPR.number);
            core.setOutput('pr_title', linkedPR.title);
            core.setOutput('branch', linkedPR.head.ref);

            const isAlreadyMerged = Boolean(linkedPR.merged_at);
            if (isAlreadyMerged) {
              core.info(`PR #${linkedPR.number} is already merged. Continuing with issue closure.`);
            }

            if (!isAlreadyMerged) {
              // Verify review status
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: linkedPR.number
              });

              const approved = reviews.some(r => r.state === 'APPROVED');
              const blocked = reviews.some(r => r.state === 'CHANGES_REQUESTED');

              if (blocked) {
                core.setFailed(`PR #${linkedPR.number} has outstanding change requests. Cannot merge.`);
                return;
              }

              if (!approved) {
                core.warning(`PR #${linkedPR.number} has no approving review. Proceeding anyway (pipeline-approved).`);
              }

              // Squash-merge the PR
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: linkedPR.number,
                  merge_method: 'squash'
                });
                core.info(`Successfully merged PR #${linkedPR.number}`);
              } catch (error) {
                core.setFailed(`Failed to merge PR #${linkedPR.number}: ${error.message}`);
                return;
              }

              // Delete the feature branch
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${linkedPR.head.ref}`
                });
                core.info(`Deleted branch: ${linkedPR.head.ref}`);
              } catch (error) {
                core.warning(`Could not delete branch ${linkedPR.head.ref}: ${error.message}`);
              }
            }

      - name: Update labels and close issue
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          PR_NUMBER: ${{ steps.merge.outputs.pr_number }}
          PR_TITLE: ${{ steps.merge.outputs.pr_title }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            const prNumber = process.env.PR_NUMBER;
            const prTitle = process.env.PR_TITLE;
            const branch = process.env.BRANCH;

            // Remove all cloud/* labels
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const cloudLabels = issue.labels
              .map(l => l.name)
              .filter(name => name.startsWith('cloud/'));

            for (const label of cloudLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label
                });
              } catch (e) {
                // Label may not exist
              }
            }

            // Add cloud/done
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['cloud/done']
            });

            // Post completion comment
            const timestamp = new Date().toISOString();
            const lines = [
              '## ✅ Pipeline — Complete',
              '',
              `**Timestamp:** ${timestamp}`,
              `**PR:** #${prNumber} — ${prTitle}`,
              `**Branch:** \`${branch}\` → \`main\` (squash-merged, branch deleted)`,
              '',
              '### Pipeline Summary',
              '',
              'Stage | Status',
              '--- | ---',
              'Triage | ✅ Complete',
              'Plan | ✅ Complete',
              'Implement | ✅ Complete',
              'Review | ✅ Approved',
              'Docs | ✅ Complete',
              'Finish | ✅ Merged & Closed',
              '',
              'The full AI-SDLC pipeline has completed successfully. This issue is now closed.',
              '',
              '---',
              '*Pipeline — Finish • Automated by GitHub Actions*'
            ];
            const body = lines.join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

            // Close the issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });

            core.info(`Issue #${issueNumber} closed as completed.`);
