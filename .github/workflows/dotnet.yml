name: .NET Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-docs:
    name: Lint documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown with Super-Linter
        uses: github/super-linter@v5
        env:
          VALIDATE_MARKDOWN: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER_REGEX_EXCLUDE: '^(.*/node_modules/.*|.*/bin/.*|.*/obj/.*)$'

  build:
    uses: ./.github/workflows/build-and-test.yml
    with:
      dotnet-version: "9.0.x"
      # Skip installing Playwright on pull_request runs to speed up PR checks
      install-playwright: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}

  security-scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache .NET tools
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-dotnet-tools-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-tools-

      - name: Restore dependencies
        run: dotnet restore

      - name: Dependency vulnerability scan
        run: dotnet list package --vulnerable --include-transitive || true

  code-quality:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache .NET tools
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-dotnet-tools-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-tools-

      - name: Restore dependencies
        run: dotnet restore

      - name: Code analysis
        run: dotnet build --configuration Release --verbosity normal

  # ─────────────────────────────────────────────────────────────────────
  # PIPELINE INTEGRATION: Report build status to linked pipeline issue
  # ─────────────────────────────────────────────────────────────────────
  pipeline-report:
    name: Pipeline build report
    runs-on: ubuntu-latest
    needs: [build, security-scan, code-quality]
    if: github.event_name == 'pull_request'
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Report to pipeline issue (if applicable)
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
          QUALITY_RESULT: ${{ needs.code-quality.result }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            // Check if this PR is part of the pipeline (has pipeline branch pattern)
            const branch = pr.head.ref || '';
            const isPipelinePR = branch.startsWith('feat/issue-');
            if (!isPipelinePR) {
              core.info('Not a pipeline PR. Skipping pipeline report.');
              return;
            }

            // Extract issue number from branch name
            const branchMatch = branch.match(/issue-(\d+)/);
            if (!branchMatch) return;
            const issueNumber = parseInt(branchMatch[1]);

            const buildResult = process.env.BUILD_RESULT;
            const securityResult = process.env.SECURITY_RESULT;
            const qualityResult = process.env.QUALITY_RESULT;
            const allPassed = buildResult === 'success' && securityResult === 'success' && qualityResult === 'success';
            const timestamp = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';

            // Post CI results to the pipeline issue
            const comment = [
              `## 🏗️ Pipeline — CI Status Update`,
              ``,
              `**Source:** \`dotnet.yml\` workflow  `,
              `**Timestamp:** ${timestamp}  `,
              `**PR:** #${pr.number} (\`${branch}\`)`,
              ``,
              `| Job | Status |`,
              `|-----|--------|`,
              `| Build & Test | ${buildResult === 'success' ? '✅ Pass' : '❌ Fail'} |`,
              `| Security Scan | ${securityResult === 'success' ? '✅ Pass' : '❌ Fail'} |`,
              `| Code Quality | ${qualityResult === 'success' ? '✅ Pass' : '❌ Fail'} |`,
              ``,
              allPassed
                ? `✅ All CI checks passed. Pipeline can proceed.`
                : `⚠️ CI checks have failures. The pipeline test stage will provide detailed diagnostics.`,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: comment,
            });
