name: Pipeline Controller

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # INTAKE: Triggered when a new issue is opened
  # ─────────────────────────────────────────────────────────────────────
  # INTAKE → TRIAGE → ROUTE: Full pipeline initialization on new issues
  # Runs all three early stages in a single job since GITHUB_TOKEN
  # label events don't re-trigger the same workflow.
  # ─────────────────────────────────────────────────────────────────────
  intake:
    if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure pipeline labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const pipelineLabels = [
              { name: 'pipeline:intake', color: '6f42c1', description: 'SDLC Pipeline — Intake stage' },
              { name: 'pipeline:triage', color: '6f42c1', description: 'SDLC Pipeline — Triage stage' },
              { name: 'pipeline:planning', color: '1f6feb', description: 'SDLC Pipeline — Planning stage' },
              { name: 'pipeline:implementing', color: '1f6feb', description: 'SDLC Pipeline — Implementation stage' },
              { name: 'pipeline:testing', color: 'fbca04', description: 'SDLC Pipeline — Testing stage' },
              { name: 'pipeline:reviewing', color: 'fbca04', description: 'SDLC Pipeline — Review stage' },
              { name: 'pipeline:deploying', color: '0e8a16', description: 'SDLC Pipeline — Deployment stage' },
              { name: 'pipeline:done', color: '0e8a16', description: 'SDLC Pipeline — Completed' },
              { name: 'pipeline:rollback', color: 'b60205', description: 'SDLC Pipeline — Rolling back deployment' },
              { name: 'pipeline:rolled-back', color: 'b60205', description: 'SDLC Pipeline — Successfully rolled back' },
              { name: 'pipeline:blocked', color: 'b60205', description: 'SDLC Pipeline — Blocked (needs human)' },
              { name: 'pipeline:failed', color: 'b60205', description: 'SDLC Pipeline — Failed (needs intervention)' },
              { name: 'pipeline:retrying', color: 'e4e669', description: 'SDLC Pipeline — Retrying after failure' },
              { name: 'needs-info', color: 'e4e669', description: 'Issue needs additional information' },
              { name: 'needs-investigation', color: 'e4e669', description: 'Needs human investigation' },
              { name: 'urgent', color: 'b60205', description: 'Requires immediate attention' },
            ];
            for (const lbl of pipelineLabels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: lbl.name });
                await github.rest.issues.updateLabel({ ...context.repo, ...lbl });
              } catch {
                await github.rest.issues.createLabel({ ...context.repo, ...lbl });
              }
            }

      - name: "Stage 1: Intake — Validate issue quality"
        id: intake
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const title = issue.title || '';

            // Skip issues that opt out of pipeline
            if (body.includes('[skip pipeline]') || body.includes('[no pipeline]')) {
              core.info('Issue opted out of pipeline. Skipping.');
              core.setOutput('proceed', 'false');
              return;
            }

            const timestamp = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';

            // Quality checks
            const checks = {
              hasTitle: title.length > 5,
              hasDescription: body.length > 50,
              hasAcceptanceCriteria: /accept|criteria|expected|should|must/i.test(body),
              hasContext: body.length > 100 || /steps|environment|version|browser/i.test(body),
            };

            const passed = Object.values(checks).filter(Boolean).length;
            const total = Object.values(checks).length;
            const allPassed = passed === total;

            if (!allPassed) {
              const missing = [];
              if (!checks.hasTitle) missing.push('- A more descriptive title (at least 6 characters)');
              if (!checks.hasDescription) missing.push('- A detailed description (current body is too short)');
              if (!checks.hasAcceptanceCriteria) missing.push('- Acceptance criteria or expected behavior');
              if (!checks.hasContext) missing.push('- Additional context (environment, steps to reproduce, etc.)');

              const narrative = [
                `## 📥 Pipeline — Intake Stage`,
                ``,
                `**Agent:** \`issue-helper\`  `,
                `**Timestamp:** ${timestamp}`,
                ``,
                `### Assessment`,
                ``,
                `I've reviewed this issue for pipeline readiness. Quality score: **${passed}/${total}** checks passed.`,
                ``,
                `### Missing Information`,
                ``,
                `To proceed through the automated pipeline, please add:`,
                ``,
                ...missing,
                ``,
                `### Status`,
                ``,
                `⏸️ Pipeline paused — waiting for additional information. Once updated, the pipeline will re-evaluate automatically.`,
              ].join('\n');

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: narrative,
              });

              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issue.number,
                labels: ['needs-info'],
              });

              core.setOutput('proceed', 'false');
              return;
            }

            // Issue passes intake
            const narrative = [
              `## 📥 Pipeline — Intake Stage`,
              ``,
              `**Agent:** \`issue-helper\`  `,
              `**Timestamp:** ${timestamp}`,
              ``,
              `### Assessment`,
              ``,
              `Issue accepted into the automated SDLC pipeline. Quality score: **${passed}/${total}** ✅`,
              ``,
              `**What I see:**`,
              `- **Title:** Clear and descriptive ✅`,
              `- **Description:** ${body.length} chars with sufficient detail ✅`,
              `- **Acceptance criteria:** Found expected behavior/criteria keywords ✅`,
              `- **Context:** Adequate supporting information ✅`,
              ``,
              `### Decision`,
              ``,
              `This issue has everything needed for automated processing. Proceeding to triage for classification.`,
              ``,
              `### Next`,
              ``,
              `Handing off to **Triage** stage for difficulty/type/priority classification.`,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: narrative,
            });

            const state = {
              pipeline: 'sdlc',
              stage: 'intake',
              status: 'completed',
              branch: null,
              attempt: 1,
              agents_assigned: [],
              execution_order: [],
              artifacts: {},
              next: 'triage',
              timestamp: new Date().toISOString(),
            };

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: `<details>\n<summary>📊 Pipeline State</summary>\n\n\`\`\`json\n${JSON.stringify(state, null, 2)}\n\`\`\`\n\n</details>`,
            });

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: ['pipeline:intake'],
            });

            core.setOutput('proceed', 'true');

      - name: "Stage 2: Triage — Classify issue"
        id: triage
        if: steps.intake.outputs.proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const timestamp = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';

            // ── Type Classification ──
            let type = 'enhancement';
            const typeReasons = [];

            if (/bug|broken|error|crash|fail|exception|fix/i.test(title + ' ' + body)) {
              type = 'bug';
              typeReasons.push('matched bug/error keywords');
            } else if (/refactor|clean|restructure|reorganize/i.test(title + ' ' + body)) {
              type = 'refactor';
              typeReasons.push('matched refactor keywords');
            } else if (/security|vulnerab|auth|xss|csrf|inject/i.test(title + ' ' + body)) {
              type = 'security';
              typeReasons.push('matched security keywords');
            } else if (/feature|add|create|implement|new/i.test(title + ' ' + body)) {
              type = 'enhancement';
              typeReasons.push('matched feature/enhancement keywords');
            }

            // ── Difficulty Classification ──
            const difficultKeywords = [
              'authentication', 'authorize', 'oauth', 'identity',
              'playwright', 'end-to-end', 'e2e',
              'docker', 'container', 'kubernetes',
              'telemetry', 'application insights',
              'security', 'hsts', 'pipeline', 'ci/cd',
              'architecture', 'migration', 'performance',
            ];
            const moderateKeywords = [
              'controller', 'service', 'middleware', 'model',
              'health check', 'logging', 'tests', 'integration',
              'view', 'form', 'validation', 'api',
            ];

            const bulletCount = ((issue.body || '').match(/^\s*[-*]\s+/gm) || []).length;
            const bodyLen = (issue.body || '').length;
            const contains = (list) => list.some(k => (title + ' ' + body).includes(k));

            let difficulty = 'moderate';
            const diffReasons = [];

            if (contains(difficultKeywords)) {
              difficulty = 'hard';
              diffReasons.push('contains complex-domain keywords');
            } else if (contains(moderateKeywords)) {
              difficulty = 'moderate';
              diffReasons.push('contains moderate-scope keywords');
            } else if (bodyLen < 300 && bulletCount <= 1) {
              difficulty = 'easy';
              diffReasons.push(`short scope (${bodyLen} chars, ${bulletCount} bullets)`);
            }

            if (bulletCount > 5 && difficulty !== 'hard') {
              difficulty = 'hard';
              diffReasons.push(`high bullet count (${bulletCount}) suggests broad scope`);
            }

            // ── Priority Classification ──
            let priority = 'medium';
            if (/critical|urgent|blocker|asap|production down/i.test(title + ' ' + body)) {
              priority = 'critical';
            } else if (/high priority|important|breaking/i.test(title + ' ' + body)) {
              priority = 'high';
            } else if (/low priority|nice to have|minor|someday/i.test(title + ' ' + body)) {
              priority = 'low';
            }

            // ── Scope Estimation ──
            const scopeAreas = [];
            if (/controller|api|endpoint|route/i.test(body)) scopeAreas.push('Controllers');
            if (/model|viewmodel|entity/i.test(body)) scopeAreas.push('Models');
            if (/view|razor|cshtml|ui|form|page/i.test(body)) scopeAreas.push('Views');
            if (/css|style|layout|bootstrap/i.test(body)) scopeAreas.push('CSS/Styling');
            if (/javascript|js|client/i.test(body)) scopeAreas.push('JavaScript');
            if (/test|spec|assert/i.test(body)) scopeAreas.push('Tests');
            if (/middleware|program\.cs|startup/i.test(body)) scopeAreas.push('Middleware/Config');
            if (/docker|workflow|deploy|ci/i.test(body)) scopeAreas.push('DevOps');
            if (/doc|readme|comment/i.test(body)) scopeAreas.push('Documentation');
            if (scopeAreas.length === 0) scopeAreas.push('TBD (determined during planning)');

            // ── Post Narrative ──
            const narrative = [
              `## 🏷️ Pipeline — Triage Stage`,
              ``,
              `**Agent:** \`issue-helper\`  `,
              `**Timestamp:** ${timestamp}`,
              ``,
              `### Classification`,
              ``,
              `| Attribute | Value | Reasoning |`,
              `|-----------|-------|-----------|`,
              `| **Type** | ${type} | ${typeReasons.join('; ') || 'default classification'} |`,
              `| **Difficulty** | ${difficulty} | ${diffReasons.join('; ')} |`,
              `| **Priority** | ${priority} | Keyword analysis of title and body |`,
              ``,
              `### Scope Estimation`,
              ``,
              `Based on keywords and structure, I expect this issue touches:`,
              `- **Areas:** ${scopeAreas.join(', ')}`,
              `- **Estimated files:** ${difficulty === 'easy' ? '1-3' : difficulty === 'moderate' ? '3-8' : '8+'} files`,
              `- **Tests needed:** ${type === 'bug' ? 'Regression test + fix verification' : 'Unit + integration tests for new behavior'}`,
              `- **Docs needed:** ${type === 'enhancement' ? 'README update + XML comments' : 'Minimal (inline comments)'}`,
              ``,
              `### Thinking`,
              ``,
              `I classified this as **${difficulty}** because ${diffReasons.join(' and ') || 'it falls in the moderate default range'}. `,
              `The ${type} type was determined by ${typeReasons.join(' and ') || 'the general nature of the request'}. `,
              `Priority is **${priority}** based on urgency signals in the text.`,
              ``,
              `### Next`,
              ``,
              `Handing off to **Route** stage. The orchestrator will determine which specialist agents are needed and in what order.`,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: narrative,
            });

            // Post machine-readable state
            const state = {
              pipeline: 'sdlc',
              stage: 'triage',
              status: 'completed',
              classification: { type, difficulty, priority, scope_areas: scopeAreas },
              branch: null,
              attempt: 1,
              agents_assigned: [],
              execution_order: [],
              artifacts: {},
              next: 'route',
              timestamp: new Date().toISOString(),
            };

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: `<details>\n<summary>📊 Pipeline State</summary>\n\n\`\`\`json\n${JSON.stringify(state, null, 2)}\n\`\`\`\n\n</details>`,
            });

            // Update labels
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: issue.number,
                name: 'pipeline:intake',
              });
            } catch { /* ignore */ }

            const labelsToAdd = ['pipeline:triage', type, difficulty];
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: labelsToAdd,
            });

            // Pass classification data to next step via output
            core.setOutput('proceed', 'true');
            core.setOutput('type', type);
            core.setOutput('difficulty', difficulty);
            core.setOutput('priority', priority);
            core.setOutput('scope_areas', JSON.stringify(scopeAreas));

      - name: "Stage 3: Route — Assign specialist agents"
        id: route
        if: steps.triage.outputs.proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = (issue.body || '').toLowerCase();
            const title = (issue.title || '').toLowerCase();
            const text = title + ' ' + body;
            const timestamp = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';

            // Read classification from triage step output
            const type = '${{ steps.triage.outputs.type }}' || 'enhancement';
            const difficulty = '${{ steps.triage.outputs.difficulty }}' || 'moderate';
            const priority = '${{ steps.triage.outputs.priority }}' || 'medium';
            const scopeAreas = JSON.parse('${{ steps.triage.outputs.scope_areas }}' || '[]');

            const classification = { type, difficulty, priority, scope_areas: scopeAreas };

            // ── Agent Assignment Logic ──
            const agents = [];
            const reasons = {};

            if (/controller|model|service|middleware|program\.cs|api|endpoint|dependency injection/i.test(text) ||
                scopeAreas.some(a => ['Controllers', 'Models', 'Middleware/Config'].includes(a))) {
              agents.push('backend');
              reasons.backend = 'Issue involves server-side logic, controllers, models, or middleware';
            }

            if (/view|razor|cshtml|html|css|javascript|ui|form|page|layout|style/i.test(text) ||
                scopeAreas.some(a => ['Views', 'CSS/Styling', 'JavaScript'].includes(a))) {
              agents.push('frontend');
              reasons.frontend = 'Issue involves views, UI components, or client-side code';
            }

            if (/security|auth|vulnerab|xss|csrf|inject|encrypt|secret|https/i.test(text) ||
                classification.type === 'security') {
              agents.push('security');
              reasons.security = 'Issue has security implications requiring hardening or auth work';
            }

            if (/docker|workflow|deploy|ci|pipeline|github actions|container/i.test(text) ||
                scopeAreas.includes('DevOps')) {
              agents.push('devops');
              reasons.devops = 'Issue involves CI/CD, deployment, or infrastructure';
            }

            if (agents.length === 0) {
              agents.push('backend');
              reasons.backend = 'Default assignment — most issues involve backend changes';
            }

            if (classification.type === 'enhancement') {
              agents.push('docs');
              reasons.docs = 'Enhancement requires documentation updates';
            }

            agents.push('testing');
            reasons.testing = 'All pipeline items require test coverage';

            const uniqueAgents = [...new Set(agents)];

            // ── Execution Order ──
            const parallelGroup = uniqueAgents.filter(a => ['backend', 'frontend', 'security', 'devops'].includes(a));
            const sequentialGroup = uniqueAgents.filter(a => ['testing', 'docs'].includes(a));
            const executionOrder = [];
            if (parallelGroup.length > 0) executionOrder.push(parallelGroup);
            for (const agent of sequentialGroup) executionOrder.push([agent]);

            // ── Agents NOT assigned ──
            const allAgents = ['backend', 'frontend', 'security', 'devops', 'docs', 'testing'];
            const notAssigned = allAgents.filter(a => !uniqueAgents.includes(a));
            const notAssignedReasons = {};
            for (const a of notAssigned) {
              if (a === 'frontend') notAssignedReasons[a] = 'No UI/view changes detected in scope';
              else if (a === 'security') notAssignedReasons[a] = 'No security-sensitive keywords or patterns found';
              else if (a === 'devops') notAssignedReasons[a] = 'No CI/CD or infrastructure changes needed';
              else if (a === 'docs') notAssignedReasons[a] = 'Bug fix — minimal documentation impact';
              else if (a === 'backend') notAssignedReasons[a] = 'No server-side logic changes needed';
              else notAssignedReasons[a] = 'Not relevant to this issue scope';
            }

            // ── Post Narrative ──
            const assignedTable = uniqueAgents.map((a) => {
              const order = parallelGroup.includes(a) ? '1 (parallel)' : `${executionOrder.findIndex(g => g.includes(a)) + 1} (sequential)`;
              return `| ${order} | \`${a}\` | ${reasons[a]} |`;
            }).join('\n');

            const notAssignedList = Object.entries(notAssignedReasons)
              .map(([a, r]) => `- \`${a}\`: ${r}`)
              .join('\n');

            const narrative = [
              `## 🔀 Pipeline — Route Stage`,
              ``,
              `**Agent:** \`orchestrator\`  `,
              `**Timestamp:** ${timestamp}`,
              ``,
              `### Analysis`,
              ``,
              `I've reviewed the triage classification and issue content to determine the right specialists.`,
              ``,
              `**Issue type:** ${classification.type}  `,
              `**Difficulty:** ${classification.difficulty}  `,
              `**Scope areas:** ${scopeAreas.join(', ') || 'General'}`,
              ``,
              `### Agent Assignments`,
              ``,
              `| Order | Agent | Rationale |`,
              `|-------|-------|-----------|`,
              assignedTable,
              ``,
              `### Agents NOT Assigned (with reasoning)`,
              ``,
              notAssignedList || '*(all relevant agents assigned)*',
              ``,
              `### Execution Strategy`,
              ``,
              `**Order:** ${executionOrder.map((g, i) => `Step ${i+1}: ${g.join(' + ')}`).join(' → ')}`,
              ``,
              `**Rationale:** ${parallelGroup.length > 1 ? 'Implementation agents can work in parallel since their outputs are independent. ' : ''}Testing must wait for implementation to complete. ${uniqueAgents.includes('docs') ? 'Documentation is last to capture the final state.' : ''}`,
              ``,
              `### Next`,
              ``,
              `Handing off to **Plan** stage. The planner will research the codebase and create a detailed implementation plan for each assigned agent.`,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: narrative,
            });

            // Post machine-readable state
            const state = {
              pipeline: 'sdlc',
              stage: 'route',
              status: 'completed',
              classification: classification,
              branch: null,
              attempt: 1,
              agents_assigned: uniqueAgents,
              execution_order: executionOrder,
              artifacts: {},
              next: 'plan',
              timestamp: new Date().toISOString(),
            };

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: `<details>\n<summary>📊 Pipeline State</summary>\n\n\`\`\`json\n${JSON.stringify(state, null, 2)}\n\`\`\`\n\n</details>`,
            });

            // Update labels: remove triage, add planning
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: issue.number,
                name: 'pipeline:triage',
              });
            } catch { /* ignore */ }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: ['pipeline:planning'],
            });

  # ─────────────────────────────────────────────────────────────────────
  # MANUAL COMMANDS: Respond to /pipeline commands in comments
  # ─────────────────────────────────────────────────────────────────────
  manual-command:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      startsWith(github.event.comment.body, '/pipeline')
    runs-on: ubuntu-latest
    steps:
      - name: Process pipeline command
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body.trim();
            const issue = context.payload.issue;
            const timestamp = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';

            const commands = {
              '/pipeline status': 'status',
              '/pipeline resume': 'resume',
              '/pipeline restart': 'restart',
            };

            let command = null;
            let args = '';
            for (const [prefix, cmd] of Object.entries(commands)) {
              if (comment.startsWith(prefix)) {
                command = cmd;
                args = comment.slice(prefix.length).trim();
                break;
              }
            }
            if (comment.startsWith('/pipeline skip')) {
              command = 'skip';
              args = comment.replace('/pipeline skip', '').trim();
            }

            if (!command) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `⚠️ Unknown pipeline command. Available:\n- \`/pipeline status\` — Show current state\n- \`/pipeline resume\` — Resume from last completed stage\n- \`/pipeline restart\` — Restart from intake\n- \`/pipeline skip {stage}\` — Skip a stage`,
              });
              return;
            }

            if (command === 'status') {
              // Find latest state comment
              const comments = await github.rest.issues.listComments({
                ...context.repo,
                issue_number: issue.number,
              });

              let latestState = null;
              for (const c of comments.data.reverse()) {
                const match = c.body.match(/```json\n([\s\S]*?)\n```/);
                if (match) {
                  try {
                    const parsed = JSON.parse(match[1]);
                    if (parsed.pipeline === 'sdlc') {
                      latestState = parsed;
                      break;
                    }
                  } catch { /* skip */ }
                }
              }

              const statusMsg = latestState
                ? `## 📊 Pipeline Status\n\n**Stage:** ${latestState.stage}\n**Status:** ${latestState.status}\n**Branch:** ${latestState.branch || 'not created yet'}\n**Attempt:** ${latestState.attempt}\n**Last updated:** ${latestState.timestamp}`
                : `## 📊 Pipeline Status\n\nNo pipeline state found on this issue.`;

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: statusMsg,
              });
            } else if (command === 'restart') {
              // Remove all pipeline labels
              const pipelineLabels = issue.labels
                .filter(l => l.name.startsWith('pipeline:'))
                .map(l => l.name);

              for (const lbl of pipelineLabels) {
                try {
                  await github.rest.issues.removeLabel({
                    ...context.repo,
                    issue_number: issue.number,
                    name: lbl,
                  });
                } catch { /* ignore */ }
              }

              // Also remove classification labels
              const classLabels = issue.labels
                .filter(l => ['bug', 'enhancement', 'refactor', 'security', 'easy', 'moderate', 'hard'].includes(l.name))
                .map(l => l.name);
              for (const lbl of classLabels) {
                try {
                  await github.rest.issues.removeLabel({
                    ...context.repo,
                    issue_number: issue.number,
                    name: lbl,
                  });
                } catch { /* ignore */ }
              }

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: [
                  `## 🔄 Pipeline — Manual Restart`,
                  ``,
                  `**Requested by:** @${context.actor}  `,
                  `**Timestamp:** ${timestamp}`,
                  ``,
                  `Pipeline state has been reset (all pipeline labels removed).`,
                  ``,
                  `**To restart the pipeline**, close and reopen this issue.`,
                  `The \`issues.opened\` event will trigger a fresh intake → triage → route cycle.`,
                  ``,
                  `> **Why?** GitHub Actions' GITHUB_TOKEN cannot re-trigger the same workflow via label events.`,
                  `> Closing and reopening generates a user-initiated event that bypasses this limitation.`,
                ].join('\n'),
              });
            }
