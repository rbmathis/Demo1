name: Pipeline — Test & Review

on:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  issues: write
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # TEST: Triggered when pipeline:testing label is applied to a PR
  # or when a PR with that label is updated (fix pushed after failure)
  # ─────────────────────────────────────────────────────────────────────
  test:
    if: >-
      github.event_name == 'pull_request' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'pipeline:testing') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'pipeline:testing'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        id: build
        run: dotnet build --configuration Release --no-restore 2>&1 | tee build-output.txt
        continue-on-error: true

      - name: Run tests
        id: test
        if: steps.build.outcome == 'success'
        run: |
          dotnet test --configuration Release --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            2>&1 | tee test-output.txt
        continue-on-error: true

      - name: Parse linked issue number from PR
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            // Look for "Closes #N" or "Refs: #N" patterns
            const match = body.match(/(?:closes|fixes|resolves|refs:?)\s*#(\d+)/i);
            if (match) {
              core.setOutput('number', match[1]);
            } else {
              // Try to extract from branch name: feat/issue-N-slug
              const branchMatch = pr.head.ref.match(/issue-(\d+)/);
              if (branchMatch) {
                core.setOutput('number', branchMatch[1]);
              } else {
                core.setOutput('number', '');
              }
            }

      - name: Post test results to issue
        id: report
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          TEST_RESULT: ${{ steps.test.outcome }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            if (!issueNumber) {
              core.warning('Could not determine linked issue number. Skipping pipeline comment.');
              return;
            }

            const buildResult = process.env.BUILD_RESULT;
            const testResult = process.env.TEST_RESULT;
            const pr = context.payload.pull_request;
            const timestamp = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
            const allPassed = buildResult === 'success' && testResult === 'success';

            // ── Post Narrative ──
            const narrative = [
              `## 🧪 Pipeline — Test Stage`,
              ``,
              `**Agent:** \`testing\` + \`build-validator\`  `,
              `**Timestamp:** ${timestamp}  `,
              `**PR:** #${pr.number}`,
              ``,
              `### Test Results`,
              ``,
              `| Check | Status | Details |`,
              `|-------|--------|---------|`,
              `| Build | ${buildResult === 'success' ? '✅ Pass' : '❌ Fail'} | \`dotnet build --configuration Release\` |`,
              `| Tests | ${testResult === 'success' ? '✅ Pass' : testResult === 'skipped' ? '⏭️ Skipped (build failed)' : '❌ Fail'} | \`dotnet test\` |`,
              ``,
              allPassed ? `### ✅ All Checks Passed` : `### ❌ Checks Failed`,
              ``,
              allPassed
                ? `Build compiles cleanly and all tests pass. The implementation appears correct.`
                : `${buildResult !== 'success' ? 'Build failed — there are compilation errors that must be resolved.' : 'One or more tests failed — the implementation has issues that need fixing.'}`,
              ``,
              `### Thinking`,
              ``,
              allPassed
                ? `The existing test suite passes with the new changes, which gives confidence that no regressions were introduced. The build-validator confirms project health.`
                : `The failure needs investigation. ${buildResult !== 'success' ? 'Build errors suggest syntax issues or missing references in the new code.' : 'Test failures suggest the implementation doesn\'t match expected behavior or broke existing functionality.'}`,
              ``,
              `### Next`,
              ``,
              allPassed
                ? `Handing off to **Review** stage. The reviewer will perform architecture, security, and quality checks.`
                : `Returning to **Implement** stage for fixes. The implementer needs to address the failures and push fixes to the PR branch.`,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: narrative,
            });

            // ── Post machine-readable state ──
            const state = {
              pipeline: 'sdlc',
              stage: 'test',
              status: allPassed ? 'completed' : 'failed',
              build: buildResult,
              tests: testResult,
              pr: pr.number,
              attempt: 1,
              next: allPassed ? 'review' : 'implement',
              timestamp: new Date().toISOString(),
            };

            const stateComment = [
              `<details>`,
              `<summary>📊 Pipeline State</summary>`,
              ``,
              '```json',
              JSON.stringify(state, null, 2),
              '```',
              ``,
              `</details>`,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: stateComment,
            });

            // ── Update labels on the issue ──
            if (allPassed) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: issueNumber,
                  name: 'pipeline:testing',
                });
              } catch { /* ignore */ }

              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issueNumber,
                labels: ['pipeline:reviewing'],
              });

              // Also label the PR for review stage
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: pr.number,
                labels: ['pipeline:reviewing'],
              });

              // Signal proceed to review step (chained in same job)
              core.setOutput('proceed', 'true');
              core.setOutput('issue_number', String(issueNumber));
            } else {
              // Mark as retrying — implementer needs to fix
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body: [
                  `## 🔄 Pipeline — Test Stage (Retry Needed)`,
                  ``,
                  `**Agent:** \`pipeline\`  `,
                  `**Timestamp:** ${timestamp}`,
                  ``,
                  `Test failures detected. The implementer agent should diagnose and fix the issues, then push to the PR branch.`,
                  `The test stage will re-run automatically when the PR is updated.`,
                ].join('\n'),
              });
            }

      # ─────────────────────────────────────────────────────────────────
      # Stage 2: Review — Automated code review
      # Runs as chained step (GITHUB_TOKEN labels don't re-trigger same workflow)
      # ─────────────────────────────────────────────────────────────────
      - name: "Stage 2: Review — Automated code review"
        id: review
        if: steps.report.outputs.proceed == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.report.outputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const timestamp = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';

            // ── Get PR diff stats ──
            const files = await github.rest.pulls.listFiles({
              ...context.repo,
              pull_number: prNumber,
            });

            const changedFiles = files.data;
            const additions = changedFiles.reduce((sum, f) => sum + f.additions, 0);
            const deletions = changedFiles.reduce((sum, f) => sum + f.deletions, 0);

            // ── Automated review checks ──
            const findings = [];
            let critical = 0;
            let high = 0;
            let medium = 0;
            let low = 0;

            for (const file of changedFiles) {
              const filename = file.filename;
              const patch = file.patch || '';

              // Security checks
              if (/password|secret|key|token/i.test(patch) && !/\[Required\]|mock|test|example/i.test(patch)) {
                if (!/appsettings|launchSettings|\.example/i.test(filename)) {
                  findings.push({ severity: 'high', file: filename, issue: 'Potential secret or credential in code', category: 'Security' });
                  high++;
                }
              }

              // SQL injection check
              if (/string\s+.*=.*\$"|string\.Format.*sql|\.FromSqlRaw\(/i.test(patch)) {
                findings.push({ severity: 'critical', file: filename, issue: 'Potential SQL injection — string interpolation in query', category: 'Security' });
                critical++;
              }

              // Missing validation check for controllers
              if (/Controller\.cs$/.test(filename) && /\[HttpPost\]/.test(patch) && !/ModelState\.IsValid/.test(patch)) {
                findings.push({ severity: 'medium', file: filename, issue: 'POST action missing ModelState.IsValid check', category: 'Architecture' });
                medium++;
              }

              // Missing anti-forgery token
              if (/Controller\.cs$/.test(filename) && /\[HttpPost\]/.test(patch) && !/ValidateAntiForgeryToken/.test(patch)) {
                findings.push({ severity: 'medium', file: filename, issue: 'POST action missing [ValidateAntiForgeryToken]', category: 'Security' });
                medium++;
              }

              // Async without await
              if (/async\s+Task/.test(patch) && !/await/.test(patch)) {
                findings.push({ severity: 'low', file: filename, issue: 'Async method without await — may be synchronous', category: 'Quality' });
                low++;
              }
            }

            // ── Determine verdict ──
            const approved = critical === 0 && high === 0;

            // ── Dimension summaries ──
            const hasControllers = changedFiles.some(f => /Controller\.cs$/.test(f.filename));
            const hasTests = changedFiles.some(f => /[Tt]ests?/.test(f.filename));
            const hasDocs = changedFiles.some(f => /\.md$|\/\/\//.test(f.filename));
            const hasViews = changedFiles.some(f => /\.cshtml$/.test(f.filename));

            const dimensions = {
              architecture: critical === 0 && findings.filter(f => f.category === 'Architecture').length === 0 ? 'pass' : 'fail',
              security: findings.filter(f => f.category === 'Security' && (f.severity === 'critical' || f.severity === 'high')).length === 0 ? 'pass' : 'fail',
              quality: findings.filter(f => f.category === 'Quality').length <= 2 ? 'pass' : 'warning',
              testing: hasTests ? 'pass' : (hasControllers ? 'warning' : 'pass'),
              documentation: hasDocs || !hasControllers ? 'pass' : 'warning',
            };

            const verdictEmoji = (v) => v === 'pass' ? '✅ Pass' : v === 'warning' ? '⚠️ Warning' : '❌ Fail';

            // ── Post Review Narrative ──
            let findingsSection = '';
            if (findings.length > 0) {
              const criticalFindings = findings.filter(f => f.severity === 'critical' || f.severity === 'high');
              if (criticalFindings.length > 0) {
                findingsSection = `### Critical Findings (must fix)\n\n` +
                  criticalFindings.map((f, i) => `#### Finding ${i+1}: ${f.issue}\n- **Severity:** ${f.severity}\n- **File:** \`${f.file}\`\n- **Category:** ${f.category}\n`).join('\n');
              }
              const warnings = findings.filter(f => f.severity === 'medium' || f.severity === 'low');
              if (warnings.length > 0) {
                findingsSection += `\n### Warnings (should fix)\n\n` +
                  warnings.map(f => `- **${f.file}**: ${f.issue} (${f.severity})`).join('\n');
              }
            }

            const narrative = [
              `## 👀 Pipeline — Review Stage`,
              ``,
              `**Agent:** \`reviewer\`  `,
              `**Timestamp:** ${timestamp}  `,
              `**PR:** #${prNumber} (${additions} additions, ${deletions} deletions, ${changedFiles.length} files)`,
              ``,
              `### Review Summary`,
              ``,
              `| Dimension | Verdict | Notes |`,
              `|-----------|---------|-------|`,
              `| Architecture | ${verdictEmoji(dimensions.architecture)} | ${hasControllers ? 'Controller patterns checked' : 'No controllers modified'} |`,
              `| Security | ${verdictEmoji(dimensions.security)} | ${findings.filter(f => f.category === 'Security').length} security findings |`,
              `| Code Quality | ${verdictEmoji(dimensions.quality)} | ${findings.filter(f => f.category === 'Quality').length} quality findings |`,
              `| Test Coverage | ${verdictEmoji(dimensions.testing)} | ${hasTests ? 'Tests included' : 'No test files in PR'} |`,
              `| Documentation | ${verdictEmoji(dimensions.documentation)} | ${hasDocs ? 'Docs updated' : 'No doc changes'} |`,
              ``,
              findingsSection || '### No Critical Issues Found\n\nAll automated checks pass.',
              ``,
              `### Decision`,
              ``,
              approved
                ? `**✅ APPROVED** — No critical or high-severity issues found. Code is ready for deployment.`
                : `**❌ CHANGES REQUESTED** — ${critical + high} blocking issue(s) must be addressed before deployment.`,
              ``,
              `### Thinking`,
              ``,
              approved
                ? `I reviewed ${changedFiles.length} changed files. The implementation follows established patterns, no security vulnerabilities detected, and ${hasTests ? 'test coverage is included' : 'the changes are low-risk enough to proceed'}.`
                : `I found ${critical} critical and ${high} high-severity issues that pose security or correctness risks. These must be fixed before merging to main.`,
              ``,
              `### Next`,
              ``,
              approved
                ? `Handing off to **Deploy** stage. The deployer will merge the PR and deploy to Azure.`
                : `Returning to **Implement** stage for fixes. ${critical + high} blocking issues need resolution.\nAttempt tracking: review cycles used — check state for limit.`,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: narrative,
            });

            // ── Post machine-readable state ──
            const state = {
              pipeline: 'sdlc',
              stage: 'review',
              status: approved ? 'completed' : 'failed',
              decision: approved ? 'approved' : 'changes_requested',
              findings: { critical, high, medium, low },
              review_dimensions: dimensions,
              pr: prNumber,
              attempt: 1,
              next: approved ? 'deploy' : 'implement',
              timestamp: new Date().toISOString(),
            };

            const stateComment = [
              `<details>`,
              `<summary>📊 Pipeline State</summary>`,
              ``,
              '```json',
              JSON.stringify(state, null, 2),
              '```',
              ``,
              `</details>`,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: stateComment,
            });

            // ── Update labels ──
            if (approved) {
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: issueNumber,
                  name: 'pipeline:reviewing',
                });
              } catch { /* ignore */ }

              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issueNumber,
                labels: ['pipeline:deploying'],
              });

              // Approve the PR
              await github.rest.pulls.createReview({
                ...context.repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: '✅ Pipeline review passed. Approved for deployment.',
              });
            } else {
              // Request changes on PR
              await github.rest.pulls.createReview({
                ...context.repo,
                pull_number: prNumber,
                event: 'REQUEST_CHANGES',
                body: `Pipeline review found ${critical + high} blocking issue(s). See issue #${issueNumber} for details.`,
              });
            }
